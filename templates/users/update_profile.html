<!DOCTYPE html>
<html>
<head>
<title>Update Profile</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
}

.profile-box{
background:white;
width:380px;
padding:30px;
border-radius:18px;
box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:10px;
}

.btn-update{
background:#007bff;
color:white;
}

.btn-update:hover{
background:#0056b3;
}

.btn-password{
background:#28a745;
color:white;
}

.btn-password:hover{
background:#1f7d34;
}

.back-link{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#555;
}

.message{
text-align:center;
color:green;
margin-bottom:15px;
}
</style>

</head>
<body>

<div class="profile-box">

<h2>Update Profile</h2>

{% for message in messages %}
<p class="message">
{{ message }}
</p>
{% endfor %}


<!-- USERNAME UPDATE -->
<form method="POST">
{% csrf_token %}

<div class="form-group">
<label>Username</label>
{{ u_form.username }}
</div>

<button
type="submit"
name="update_profile"
value="1"
class="btn btn-update">
Update Username
</button>

</form>


<hr style="margin:25px 0;">


<!-- CHANGE PASSWORD -->
<form method="POST">
{% csrf_token %}

<div class="form-group">
<label>Old Password</label>
{{ pwd_form.old_password }}
</div>

<div class="form-group">
<label>New Password</label>
{{ pwd_form.new_password1 }}
</div>

<div class="form-group">
<label>Confirm Password</label>
{{ pwd_form.new_password2 }}
</div>

<button
type="submit"
name="change_password"
value="1"
class="btn btn-password">
Change Password
</button>

</form>


<a href="/" class="back-link">
⬅ Back to Home
</a>

</div>

</body>
</html>

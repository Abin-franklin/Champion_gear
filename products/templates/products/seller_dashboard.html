<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;
background:#f4f6f9;
}

/* Navbar */
.navbar{
background:#222;
color:white;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar h2{
font-size:24px;
}

.add-btn{
background:#28a745;
color:white;
padding:10px 18px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.add-btn:hover{
background:#218838;
}

/* Container */
.container{
padding:40px;
}

/* Product Grid */
.product-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
}

/* Card */
.card{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 4px 14px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-body{
padding:18px;
}

.card-body h3{
margin-bottom:10px;
font-size:20px;
color:#222;
}

.card-body p{
margin-bottom:8px;
color:#555;
}

/* Buttons */
.actions{
margin-top:15px;
display:flex;
gap:10px;
}

.edit-btn{
background:#007bff;
color:white;
padding:8px 14px;
text-decoration:none;
border-radius:6px;
}

.delete-btn{
background:#dc3545;
color:white;
padding:8px 14px;
text-decoration:none;
border-radius:6px;
}

.edit-btn:hover{
background:#0056b3;
}

.delete-btn:hover{
background:#b52a37;
}

/* Empty */
.empty{
text-align:center;
margin-top:60px;
font-size:20px;
color:gray;
}

/* Responsive */
@media(max-width:1100px){
.product-grid{
grid-template-columns:repeat(3,1fr);
}
}

@media(max-width:800px){
.product-grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:500px){
.product-grid{
grid-template-columns:1fr;
}
}
</style>

</head>
<body>

<div class="navbar">
    <h2>My Products</h2>

    <a href="{% url 'add_product' %}" class="add-btn">
        + Add Product
    </a>
</div>

<div class="container">

{% if products %}
<div class="product-grid">

{% for product in products %}
<div class="card">

    <img src="{{ product.image.url }}" alt="{{ product.name }}">

    <div class="card-body">
        <h3>{{ product.name }}</h3>

        <p><strong>Category:</strong> {{ product.category }}</p>

        <p><strong>Price:</strong> ₹{{ product.price }}</p>

        <div class="actions">
            <a href="{% url 'edit_product' product.id %}" class="edit-btn">
                Edit
            </a>

            <a href="{% url 'delete_product' product.id %}" class="delete-btn">
                Delete
            </a>
        </div>

    </div>
</div>
{% endfor %}

</div>

{% else %}
<p class="empty">No products added yet.</p>
{% endif %}

</div>

</body>
</html>
